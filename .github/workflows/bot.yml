name: Asya Bot SMART ROUTING v3

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'   # Every 5 hours
  workflow_dispatch:                     # Manual trigger

concurrency:
  group: asya-bot-single
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  OWNER_ID: ${{ secrets.OWNER_ID }}
  CHANNEL_ID: "-1001479468835"
  CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
  GH_REPO: sochiautoparts/asya-bot
  ADMITAD_ADS_FILE: data/admitad_ads.json
  DB_PATH: asya_bot.db
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO
  # Local model — PRIMARY for simple chat (saves cloud balance!)
  ENABLE_LOCAL_MODEL: "true"
  MODEL_PATH: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
  MODEL_N_CTX: 4096
  MODEL_N_THREADS: 4
  MODEL_MAX_TOKENS: 384
  MODEL_HISTORY_LIMIT: 6

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours max (slightly more than 5h interval)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════════════
      #  LOCAL MODEL — Qwen3-4B (n_ctx=4096) PRIMARY for simple chat!
      # ═══════════════════════════════════════════════════════════

      - name: Install llama-cpp-python with AVX2
        run: |
          echo "=== Installing llama-cpp-python with AVX2 support ==="
          CMAKE_ARGS="-DGGML_AVX2=on" pip install llama-cpp-python --force-reinstall --no-cache-dir 2>&1 || {
            echo "WARNING: AVX2 build failed, trying without..."
            pip install llama-cpp-python --force-reinstall --no-cache-dir
          }
          python3 -c "from llama_cpp import Llama; print('llama-cpp-python OK!')" || {
            echo "WARNING: llama-cpp-python import failed — running CLOUD-ONLY"
          }
          pip install huggingface_hub

      - name: Cache LOCAL PRIMARY model (Qwen3-4B)
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          key: qwen3-4b-instruct-q4km-v3

      - name: Download Qwen3-4B-Instruct GGUF model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Qwen3-4B-Instruct Q4_K_M model (~2.4GB) — LOCAL PRIMARY ==="
          mkdir -p models
          python3 -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='unsloth/Qwen3-4B-Instruct-2507-GGUF',
              filename='Qwen3-4B-Instruct-2507-Q4_K_M.gguf',
              local_dir='models',
          )
          print('Downloaded to:', path)
          " || echo "WARNING: Model download failed — running CLOUD-ONLY"

      - name: Verify model
        run: |
          echo "=== Verifying GGUF model ==="
          MODEL_FILE=models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          if [ ! -f "$MODEL_FILE" ] || [ ! -s "$MODEL_FILE" ]; then
            echo "WARNING: Model file missing or empty — running in CLOUD-ONLY mode"
          else
            MODEL_SIZE=$(du -h "$MODEL_FILE" | cut -f1)
            echo "OK: Qwen3-4B-Instruct-Q4_K_M (${MODEL_SIZE}) — LOCAL PRIMARY"
          fi

      - name: Download Admitad partner data
        run: |
          echo "=== Downloading admitad partner data ==="
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/creastudioai-beep/pr/main/data/admitad_ads.json" \
            -o data/admitad_ads.json || echo "Failed to download admitad data, will use cached version"
          if [ -f data/admitad_ads.json ]; then
            echo "OK: admitad_ads.json downloaded ($(wc -c < data/admitad_ads.json) bytes)"
          else
            echo "WARNING: admitad_ads.json not found"
          fi

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: asya_bot.db
          key: asya-bot-db-v3
          restore-keys: |
            asya-bot-db-

      - name: Ensure .gitignore allows database
        run: |
          # Remove asya_bot.db from .gitignore if present
          if [ -f .gitignore ]; then
            sed -i '/asya_bot\.db/d' .gitignore
          fi

      - name: Run Asya Bot with auto-restart
        run: |
          echo "=== Starting Asya Bot v3.0 SMART ROUTING ==="
          echo "CHAT (user conversations): LOCAL-FIRST → Local → Cloud → Fallback (saves balance)"
          echo "FUNCTION (posts, VIN, diagnostics, parts): CLOUD-FIRST → Cloud → Local → Fallback (better quality)"
          echo "COMMENT (comments in groups): LOCAL-ONLY → Local → Static fallback (no cloud waste)"
          echo "VISION: Pollinations vision for photos"
          echo "STRATEGY: Chat→Local-first, Function→Cloud-first, Comment→Local-only"
          echo ""
          echo "Config: strategy=SMART_ROUTING, n_ctx=4096, max_tokens=300(local)/2048(cloud), history=4(local)"

          MAX_RESTARTS=10
          RESTART_COUNT=0

          while [ $RESTART_COUNT -lt $MAX_RESTARTS ]; do
            echo "=== Bot start attempt $((RESTART_COUNT + 1))/$MAX_RESTARTS ==="

            timeout 18000 python -m bot.main || EXIT_CODE=$?
            EXIT_CODE=${EXIT_CODE:-0}

            echo "Bot exited with code: $EXIT_CODE"

            # If bot exited normally (0) or was killed by timeout, try restart
            if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 124 ]; then
              echo "Bot process ended, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 5
            else
              echo "Bot crashed with error code $EXIT_CODE, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 10
            fi
          done

          echo "Max restarts reached, workflow will be re-dispatched."

      - name: Save database
        if: always()
        run: |
          if [ -f asya_bot.db ]; then
            git config user.name "Asya Bot"
            git config user.email "asya-bot@users.noreply.github.com"
            git add asya_bot.db || true
            git diff --staged --quiet || git commit -m "db: update $(date +%Y-%m-%d_%H:%M)" || true
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Re-dispatch workflow for 24/7 operation
        if: always()
        run: |
          echo "Re-dispatching workflow for continuous operation..."
          sleep 30
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/sochiautoparts/asya-bot/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || echo "Re-dispatch failed, will retry on next schedule"
