name: Asya Bot — POLLINATIONS-ONLY v7

on:
  schedule:
    - cron: '0 */5 * * *'      # Every 5 hours
  workflow_dispatch:                     # Manual trigger

concurrency:
  group: asya-bot-single
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  OWNER_ID: ${{ secrets.OWNER_ID }}
  CHANNEL_ID: "-1001479468835"
  CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
  # Pollinations.ai — DUAL KEY FAILOVER
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  POLLINATIONS_API_KEY_2: ${{ secrets.POLLINATIONS_API_KEY_2 }}
  GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
  GH_REPO: sochiautoparts/asya-bot
  ADMITAD_ADS_FILE: data/admitad_ads.json
  DB_PATH: asya_bot.db
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO
  # Local model — DISABLED (Pollinations-only mode, restorable)
  ENABLE_LOCAL_MODEL: "false"
  # Schedule settings
  NEWS_INTERVAL_MINUTES: "30"
  CHANNEL_POST_INTERVAL_MINUTES: "30"
  PARTNER_POST_INTERVAL_HOURS: "4"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean Python cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          echo "Python cache cleaned"

      - name: Download Admitad partner data
        run: |
          echo "=== Downloading admitad partner data ==="
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/creastudioai-beep/pr/main/data/admitad_ads.json" \
            -o data/admitad_ads.json || echo "Failed to download admitad data, will use cached version"
          if [ -f data/admitad_ads.json ]; then
            echo "OK: admitad_ads.json downloaded ($(wc -c < data/admitad_ads.json) bytes)"
          else
            echo "WARNING: admitad_ads.json not found"
          fi

      - name: Restore database from cache
        uses: actions/cache@v4
        with:
          path: asya_bot.db
          key: asya-bot-db-v5
          restore-keys: |
            asya-bot-db-

      - name: Ensure .gitignore allows database
        run: |
          # Remove asya_bot.db from .gitignore if present
          if [ -f .gitignore ]; then
            sed -i '/asya_bot\.db/d' .gitignore
          fi

      - name: Run Asya Bot with auto-restart
        run: |
          echo "=== Starting Asya Bot v7.0 POLLINATIONS-ONLY ==="
          echo "ALL ROUTES: Pollinations.ai (61 models, dual-key failover)"
          echo "CHAT: Pollinations → Static fallback"
          echo "FUNCTION (posts, VIN, diagnostics): Pollinations → Static fallback"
          echo "COMMENT: Pollinations (fast models) → Static fallback"
          echo "VISION: Pollinations vision models"
          echo "CONTENT ENGINE: Web-search-first, RSS fallback, AI topic selection"
          echo "STRATEGY: Pollinations-only, dual-key=KEY1+KEY2, circuit-break=5min"
          echo "SCHEDULE: 30 min intervals, 2 posts/cycle + partner posts"
          echo "NEW: Editorial jokes, translation/uniquification, improved image pipeline"
          echo ""

          MAX_RESTARTS=10
          RESTART_COUNT=0

          while [ $RESTART_COUNT -lt $MAX_RESTARTS ]; do
            echo "=== Bot start attempt $((RESTART_COUNT + 1))/$MAX_RESTARTS ==="

            timeout 18000 python -m bot.main || EXIT_CODE=$?
            EXIT_CODE=${EXIT_CODE:-0}

            echo "Bot exited with code: $EXIT_CODE"

            # If bot exited normally (0) or was killed by timeout, try restart
            if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 124 ]; then
              echo "Bot process ended, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 5
            else
              echo "Bot crashed with error code $EXIT_CODE, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 10
            fi
          done

          echo "Max restarts reached, workflow will be re-dispatched."

      - name: Save database
        if: always()
        run: |
          if [ -f asya_bot.db ]; then
            git config user.name "Asya Bot"
            git config user.email "asya-bot@users.noreply.github.com"
            git add -f asya_bot.db || true
            git diff --staged --quiet || git commit -m "db: update $(date +%Y-%m-%d_%H:%M)" || true
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Re-dispatch workflow for 24/7 operation
        if: always()
        run: |
          echo "Re-dispatching workflow for continuous operation..."
          sleep 30
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/sochiautoparts/asya-bot/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || echo "Re-dispatch failed, will retry on next schedule"
