name: Asya Bot 24/7

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'   # Every 5 hours
  workflow_dispatch:                     # Manual trigger

concurrency:
  group: asya-bot-single
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  OWNER_ID: ${{ secrets.OWNER_ID }}
  CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
  CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
  GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
  GH_REPO: sochiautoparts/asya-bot
  ADMITAD_ADS_FILE: admitad_ads.json
  DB_PATH: asya_bot.db
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 hours max (slightly more than 5h interval)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Admitad partner data
        run: |
          curl -sL "https://raw.githubusercontent.com/creastudioai-beep/pr/main/data/admitad_ads.json" \
            -o admitad_ads.json || echo "Failed to download admitad data, will use cached version"

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: asya_bot.db
          key: asya-bot-db-${{ github.run_id }}
          restore-keys: |
            asya-bot-db-

      - name: Commit and push database changes
        run: |
          git config user.name "Asya Bot"
          git config user.email "asya-bot@users.noreply.github.com"

      - name: Run Asya Bot with auto-restart
        run: |
          echo "Starting Asya Bot..."
          MAX_RESTARTS=10
          RESTART_COUNT=0

          while [ $RESTART_COUNT -lt $MAX_RESTARTS ]; do
            echo "=== Bot start attempt $((RESTART_COUNT + 1))/$MAX_RESTARTS ==="

            timeout 18000 python -m bot.main || EXIT_CODE=$?
            EXIT_CODE=${EXIT_CODE:-0}

            echo "Bot exited with code: $EXIT_CODE"

            # If bot exited normally (0) or was killed by timeout, try restart
            if [ $EXIT_CODE -eq 0 ] || [ $EXIT_CODE -eq 124 ]; then
              echo "Bot process ended, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 5
            else
              echo "Bot crashed with error code $EXIT_CODE, restarting..."
              RESTART_COUNT=$((RESTART_COUNT + 1))
              sleep 10
            fi
          done

          echo "Max restarts reached, workflow will be re-dispatched."

      - name: Save database
        if: always()
        run: |
          if [ -f asya_bot.db ]; then
            git add asya_bot.db || true
            git diff --staged --quiet || git commit -m "db: update $(date +%Y-%m-%d_%H:%M)" || true
            git push || true
          fi

      - name: Re-dispatch workflow for 24/7 operation
        if: always()
        run: |
          echo "Re-dispatching workflow for continuous operation..."
          sleep 30
          curl -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/sochiautoparts/asya-bot/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}' || echo "Re-dispatch failed, will retry on next schedule"
